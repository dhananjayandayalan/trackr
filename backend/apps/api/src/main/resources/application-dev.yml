# dev profile: layered on top of application.yml when "dev" is active
# BLOCK 6: datasource
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trakr
    username: trakr
    password: ${POSTGRES_PASSWORD:trakr}
    hikari:
      maximum-pool-size: 20
      # milliseconds: Hikari binds this as a plain long, so "3s" fails at startup
      connection-timeout: 3000
      pool-name: trakr-api
  # BLOCK 10: redis (sessions, login lockout) and mail (Mailpit catches everything, UI on :8025)
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

# BLOCK 11: the session cookie travels over plain http on localhost
server:
  servlet:
    session:
      cookie:
        secure: false

# BLOCK 12: Swagger UI at http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    dev.trakr: debug

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
