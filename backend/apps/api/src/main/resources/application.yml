# BLOCK 1: identity
spring:
  application:
    name: trakr-api
  profiles:
    default: dev
  # BLOCK 2: threads
  threads:
    virtual:
      enabled: true
  # BLOCK 3: server (spring.* half)
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  # BLOCK 7: jpa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  # BLOCK 8: flyway
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  # BLOCK 9: jooq
  jooq:
    sql-dialect: postgres
  # BLOCK 10: sessions in Redis (cookie and timeout are under server.servlet.session)
  session:
    data:
      redis:
        # every key starts with trakr:session, shared with collab (phase 16)
        namespace: trakr:session
        # indexed: sessions can be found by user id, so a password reset can end all of them
        repository-type: indexed

# BLOCK 3: server
server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
  # BLOCK 11: the session cookie
  servlet:
    session:
      timeout: 12h
      cookie:
        name: TRAKR_SESSION
        http-only: true
        same-site: lax
        # only over HTTPS; application-dev.yml turns this off for http://localhost
        secure: true

# BLOCK 4: actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,conditions
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  # a mail outage must not mark the whole api DOWN: password reset fails, everything else works
  health:
    mail:
      enabled: false

# BLOCK 5: our properties
trakr:
  app:
    origin: ${TRAKR_APP_ORIGIN:http://localhost:5173}
  mail:
    from: ${TRAKR_MAIL_FROM:TRAKR <no-reply@trakr.local>}

# BLOCK 12: OpenAPI — /v3/api-docs is always on (the frontend generates its types from it); the UI only in dev
springdoc:
  swagger-ui:
    enabled: false
