# BLOCK 1: identity
spring:
  application:
    name: trakr-api
  profiles:
    default: dev
  # BLOCK 2: threads
  threads:
    virtual:
      enabled: true
  # BLOCK 3: server (spring.* half)
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  # BLOCK 7: jpa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  # BLOCK 8: flyway
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  # BLOCK 9: jooq
  jooq:
    sql-dialect: postgres
  # BLOCK 10: sessions in Redis (cookie and timeout are under server.servlet.session)
  session:
    data:
      redis:
        # every key starts with trakr:session, shared with collab (phase 16)
        namespace: trakr:session
        # indexed: sessions can be found by user id, so a password reset can end all of them
        repository-type: indexed

  # BLOCK 13: kafka producer — the Modulith externalizer sends the outbox's events with this
  kafka:
    bootstrap-servers: ${TRAKR_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # the leader and every in-sync replica have the record before the send counts as done
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Spring for Apache Kafka 4's Jackson 3 serializer (JsonSerializer is the deprecated Jackson 2 one)
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      compression-type: zstd
      properties:
        # retries can't write a record twice or out of order (the broker dedupes by producer id + sequence)
        enable.idempotence: true
        # wait up to 5 ms to batch records together: a little latency for far fewer requests
        linger.ms: 5
        # consumers route by the CloudEvents type in the body and the ce_type header, not by Java class names
        spring.json.add.type.headers: false
    # BLOCK 14: kafka consumer defaults (the realtime listener; workers have their own in phase 10)
    consumer:
      # offsets are committed by the listener container after a record is processed, never on a timer
      enable-auto-commit: false
      # only records of committed producer transactions
      isolation-level: read_committed
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # a record that isn't valid JSON fails alone instead of crashing the consumer in a loop ("poison pill")
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: dev.trakr.contracts.events.EventEnvelope
        spring.json.trusted.packages: "dev.trakr.contracts.*"
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
  # BLOCK 15: modulith events — the registry (outbox) and its externalization to Kafka
  modulith:
    events:
      externalization:
        enabled: true
      # incomplete publications (the app died before Kafka acked) are sent again at startup
      republish-outstanding-events-on-restart: true
      jdbc:
        # Flyway owns event_publication (V009)
        schema-initialization:
          enabled: false
      kafka:
        # we configure the JSON serializer above; Modulith's own JSON message converter would turn the already
        # serialized bytes into a base64 string
        enable-json: false
  # BLOCK 16: elasticsearch — Boot builds the ElasticsearchClient from this; search only reads the index
  elasticsearch:
    uris: ${TRAKR_ES_URIS:http://localhost:9200}

# BLOCK 3: server
server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
  # BLOCK 11: the session cookie
  servlet:
    session:
      timeout: 12h
      cookie:
        name: TRAKR_SESSION
        http-only: true
        same-site: lax
        # only over HTTPS; application-dev.yml turns this off for http://localhost
        secure: true

# BLOCK 4: actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,conditions
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  # a mail outage must not mark the whole api DOWN: password reset fails, everything else works
  health:
    mail:
      enabled: false

# BLOCK 5: our properties
trakr:
  events:
    # Kafka partitions per topic (04-events §4: 3 locally, 12/6 in prod)
    partitions: 3
  app:
    origin: ${TRAKR_APP_ORIGIN:http://localhost:5173}
  mail:
    from: ${TRAKR_MAIL_FROM:TRAKR <no-reply@trakr.local>}
  search:
    # the alias, never a concrete trakr-issues-v{n}: a reindex moves it without the api noticing
    index: trakr-issues

# BLOCK 12: OpenAPI — /v3/api-docs is always on (the frontend generates its types from it); the UI only in dev
springdoc:
  swagger-ui:
    enabled: false
