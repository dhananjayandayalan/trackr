# BLOCK 1: identity
spring:
  application:
    name: trakr-api
  profiles:
    default: dev
  # BLOCK 2: threads
  threads:
    virtual:
      enabled: true
  # BLOCK 3: server (spring.* half)
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  # BLOCK 7: jpa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  # BLOCK 8: flyway
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  # BLOCK 9: jooq
  jooq:
    sql-dialect: postgres

# BLOCK 3: server
server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true

# BLOCK 4: actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,conditions
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# BLOCK 5: our properties
trakr:
  app:
    origin: ${TRAKR_APP_ORIGIN:http://localhost:5173}
