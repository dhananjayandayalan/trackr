# dev profile: the local docker compose services (infra/docker-compose.yml)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trakr
    # reads issue/project/membership, writes collab_update and collab_snapshot — nothing else (V014 grants)
    username: trakr_collab
    password: ${TRAKR_COLLAB_DB_PASSWORD:trakr_collab}
    hikari:
      maximum-pool-size: 10
      pool-name: trakr-collab
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    dev.trakr: debug
