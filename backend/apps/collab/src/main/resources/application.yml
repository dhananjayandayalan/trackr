# BLOCK 1: identity
spring:
  application:
    name: trakr-collab
  profiles:
    default: dev
  # every WebSocket frame is handled on a Tomcat worker; with this on, those are virtual threads, so a frame
  # waiting on Postgres parks cheaply instead of holding a platform thread
  threads:
    virtual:
      enabled: true
  # BLOCK 2: kafka. Values are the CloudEvents envelope as JSON, like every other producer (04-events §3).
  # The consumer takes raw bytes: CollabRelay routes on the ce_type header and parses only what it needs.
  kafka:
    bootstrap-servers: ${TRAKR_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      compression-type: zstd
      properties:
        enable.idempotence: true
        linger.ms: 5
        # never block a socket's thread for long when Kafka is down: a relay message is worth 5 s at most
        max.block.ms: 5000
        spring.json.add.type.headers: false
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      # a relay group is new on every start (its name has the instance id): only what happens from now on matters
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 50
    listener:
      ack-mode: record
      observation-enabled: true
    # phase 18: relay messages and snapshots carry traceparent, so the api's snapshot consumer continues the trace
    template:
      observation-enabled: true
  # BLOCK 3: the app only reads and writes rows; the api's Flyway owns the schema
  sql:
    init:
      mode: never

# BLOCK 4: server. WebSockets upgrade from plain HTTP on this port; actuator shares it (01-architecture §2)
server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # BLOCK 6: observability (phase 18) — every request, query, Kafka send and listener becomes a span. Traces
  # and metrics go over OTLP to Grafana's all-in-one LGTM image (infra profile `observability`, :3000), only when
  # TRAKR_OTEL_ENABLED=true (.\dev.ps1 -Observability); otherwise the exporter would log a failure every few seconds.
  tracing:
    sampling:
      # every trace in dev; a busy prod would keep a fraction (TRAKR_TRACE_SAMPLING=0.1)
      probability: ${TRAKR_TRACE_SAMPLING:1.0}
    export:
      enabled: ${TRAKR_OTEL_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRAKR_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${TRAKR_OTEL_ENABLED:false}
        url: ${TRAKR_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s

# BLOCK 7: every log line carries the app, trace and span id: a log line found in Grafana (or a file) leads to its trace
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

# BLOCK 5: our properties (CollabProperties)
trakr:
  app:
    # browsers on other origins can't open a socket: the handshake's Origin header must be one of these
    origin: ${TRAKR_APP_ORIGIN:http://localhost:5173}
  session:
    # the api's session cookie and Redis namespace (apps/api application.yml): one login for REST, SSE and here
    cookie-name: TRAKR_SESSION
    namespace: trakr:session
  events:
    partitions: 3
