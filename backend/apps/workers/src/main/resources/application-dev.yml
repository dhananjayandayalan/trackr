# dev profile: the local docker compose services (infra/docker-compose.yml)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trakr
    # read-only on the domain tables, writes its read models (V014 grants); BYPASSRLS, it works across tenants
    username: trakr_workers
    password: ${TRAKR_WORKERS_DB_PASSWORD:trakr_workers}
    hikari:
      maximum-pool-size: 10
      pool-name: trakr-workers
  data:
    redis:
      host: localhost
      port: 6379
  # Mailpit catches every email, UI on http://localhost:8025
  mail:
    host: localhost
    port: 1025

trakr:
  admin:
    token: dev-admin-token

logging:
  level:
    dev.trakr: debug
