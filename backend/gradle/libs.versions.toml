[versions]
java = "25"
springBoot = "4.1.2"
springModulith = "2.1.2"
springdoc = "3.1.1"
jooq = "3.21.9"
testcontainers = "2.0.5"
# what the Boot 4.1.2 BOM manages; the elasticsearch and kibana images in infra use the same version
elasticsearch = "9.4.8"
awsSdk = "2.57.3"
antlr = "4.13.2"
owaspSanitizer = "20261011.1"
# same JUnit the Boot 4.1.2 BOM manages, so test deps never drift from Boot's
junit = "6.0.3"
# Argon2PasswordEncoder runs on BouncyCastle; the Boot BOM does not manage it
bouncycastle = "1.86"

[libraries]
# BOMs: one version per family, imported with platform(...)
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# null-safety annotations (@Nullable, @NullMarked); version from the Spring Boot BOM
jspecify = { module = "org.jspecify:jspecify" }
# @JsonProperty & co. for the event records in libs/contracts; Jackson 3 still reads these 2.x annotations
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }

# test: no version, junit-bom / the Spring Boot BOM supply it
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }

# Gradle plugins as libraries: build-logic puts them on its classpath so convention plugins can apply them
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }

# Spring Boot starters: no version, the Spring Boot BOM supplies it
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

# test starters: versions from the Spring Boot BOM
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

# persistence: versions from the Spring Boot BOM
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# identity and security: versions from the Spring Boot BOM
# (Boot 4 names: security-oauth2-client replaces the old oauth2-client starter)
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-client" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-session-data-redis = { module = "org.springframework.boot:spring-boot-starter-session-data-redis" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
# Boot 4 keeps Kafka auto-configuration in its own module; the starter brings it and Spring for Apache Kafka
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# modules: versions from the Spring Modulith BOM (trakr.spring-app imports it)
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
# the event publication registry (the outbox) on plain JDBC, and its Kafka externalizer
spring-modulith-starter-jdbc = { module = "org.springframework.modulith:spring-modulith-starter-jdbc" }
spring-modulith-events-kafka = { module = "org.springframework.modulith:spring-modulith-events-kafka" }
# Documenter: writes module diagrams from the verified structure
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs" }

# OpenAPI document + Swagger UI generated from the controllers; 3.x is the line for Boot 4
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# jOOQ codegen runs on its own classpath, outside the BOM, so it needs an explicit version
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }

# integration tests: real services in containers
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

[bundles]
# what every module's tests need, added in one line by java-conventions
testing = ["junit-jupiter", "assertj-core"]

[plugins]
# Spring Boot plugin by id, same version as the BOM
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
# generates Java classes from our SQL migrations
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
