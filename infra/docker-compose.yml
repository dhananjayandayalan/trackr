name: trakr

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

x-logging: &logging-defaults
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: trakr
      POSTGRES_USER: trakr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRAKR_API_DB_PASSWORD: ${TRAKR_API_DB_PASSWORD}
      TRAKR_WORKERS_DB_PASSWORD: ${TRAKR_WORKERS_DB_PASSWORD}
      TRAKR_COLLAB_DB_PASSWORD: ${TRAKR_COLLAB_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "pg_isready", "-U", "trakr", "-d", "trakr"]
    logging: *logging-defaults

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    logging: *logging-defaults

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092",
        ]
    logging: *logging-defaults

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *logging-defaults

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1",
        ]
    logging: *logging-defaults

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.8
    profiles: ["tools"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:5601/api/status"]
    logging: *logging-defaults

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:9333/cluster/status"]
    logging: *logging-defaults

  # BLOCK 9: mailpit
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/mailpit", "readyz"]
    logging: *logging-defaults

  # BLOCK 10: observability (phase 18) — Grafana's all-in-one OpenTelemetry image: an OTLP collector on 4317 (gRPC)
  # and 4318 (HTTP) feeding Tempo (traces), Prometheus/Mimir (metrics) and Loki (logs), with Grafana on :3000
  # (admin/admin) already wired to all three. The apps export to it when TRAKR_OTEL_ENABLED=true.
  # Start with: docker compose --env-file .env --profile observability up -d --wait   (or .\dev.ps1 -Observability)
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtmdata:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
    logging: *logging-defaults

volumes:
  lgtmdata:
  pgdata:
  redisdata:
  kafkadata:
  esdata:
  seaweeddata:
